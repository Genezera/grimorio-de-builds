ue only) and add the Viridian Wildwood to a cluster of maps. Inside you follow and collect Wisp trails; when you leave, map monsters become stronger and more rewarding based on the Wisps collected. Using more than one Ritual Tablet increases Azmeri Wisps collected."},{"img":"tile-cores","t":"New Soul Cores","d":"Jiquani's Soul Cores grant +1 level to a skill type on weapons (Totem, Curse, Mark, Warcry, Herald, Strike, Nova, Slam, Grenade, Hazard, Plant, Wind, Storm). Atziri's Soul Cores scale with equipped corrupted items."},{"img":"tile-chaos","t":"Trial of Chaos rework","d":"You can leave and come back, every room has a chest, modifiers are lighter and explicit, and final rewards are now only Currency and Soul Cores."}],"sources":[["PoE2DB — Forbidden Rites challenges","https://poe2db.tw/us/Forbidden_Rites_challenges"],["GGG — 0.5.5 Patch Notes","https://www.pathofexile.com/forum/view-thread/4000864"],["GGG — 0.5.0 Patch Notes","https://www.pathofexile.com/forum/view-thread/3932540"],["Game8 — Forbidden Rites Challenges","https://game8.co/games/Path-of-Exile-2/archives/618598"],["Game8 — Forbidden Rites Walkthrough","https://game8.co/games/Path-of-Exile-2/archives/618597"],["PoE2DB — Omens","https://poe2db.tw/us/Omen"],["poe.ninja — Forbidden Rites economy","https://poe.ninja/poe2/economy"]],"leagueEnd":"2026-12-11T20:00:00Z","challenges":[{"id":"riteseeker","name":"The Riteseeker","icon":"ritual-node","art":"ban-riteseeker","goal":11,"kind":"rites","req":"Banish each Rite by completing Rituals in the Campaign","reqpt":"Banish each Rite by completing the campaign Rituals (11).","phase":"Campaign · Acts 1–4 and Interludes","effort":"Easy, but slows the campaign","steps":["The Rites start on their own: the quest activates when you enter Clearfell in the Forbidden Rites league.","On the World Map, look for the Ritual Effigy cluster (2 per act, 1 per Interlude). In each area of the cluster, the effigy sits on the boss.","Beat the boss inside the Ritual. It is carried
