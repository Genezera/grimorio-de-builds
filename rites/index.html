rial of Chaos no Ato 3."},{"id":"t3","name":"Terceira prova","pts":2,"img":"djinn-barya","how":"Trial of the Sekhemas nível 60+ com pelo menos 3 andares (Djinn Barya) OU Trial of Chaos nível 65+ com pelo menos 10 provas (Inscribed Ultimatum)."},{"id":"t4","name":"Prova final","pts":2,"img":"inscribed-ultimatum","how":"Trial of the Sekhemas nível 75+ com pelo menos 4 andares OU Trial of Chaos nível 75+ com pelo menos 10 provas."}],"chaos055":["Agora dá para sair do Trial of Chaos no meio e continuar depois da mesma sala.","Cada sala tem um baú de recompensa no final: morrer não faz perder tudo.","Os modificadores de dificuldade agora mostram os valores reais e ficaram bem mais leves.","Nas provas 'Survive', matar os Rares reduz o tempo necessário.","O Trialmaster só para o tempo no começo da run, não em toda sala."],"omens":[{"name":"Omen of Gambling","img":"omen-OmenGambleNoGoldCost","how":"Fazer uma compra na aba Gamble de um vendedor.","price":0.001325,"trig":null,"trigPrice":0,"risk":"safe"},{"name":"Omen of Bartering","img":"omen-OmenSellVendorRandomise","how":"Vender um item a um vendedor.","price":0.04423,"trig":null,"trigPrice":0,"risk":"safe"},{"name":"Omen of Greater Exaltation","img":"omen-VoodooOmens1Yellow","how":"Usar um Exalted Orb em um item Rare (adiciona 2 mods).","price":0.01051,"trig":"Exalted Orb","trigPrice":0.002318,"risk":"safe"},{"name":"Omen of Refreshment","img":"omen-VoodooOmens1Blue","how":"Chegar a Low Life com ele ativo (recupera cargas de flasks e charms).","price":0.00105,"trig":null,"trigPrice":0,"risk":"risk"},{"name":"Omen of Amelioration","img":"omen-VoodooOmens3Blue","how":"Morrer com ele ativo (evita 75% da perda de experiência).","price":0.05644,"trig":null,"trigPrice":0,"risk":"death"},{"name":"Omen of Resurgence","img":"omen-VoodooOmens2Blue","how":"Chegar a Low Life com ele ativo (recupera vida, mana e ES).","price":0.01244,"trig":null,"trigPrice":0,"risk":"risk"},{"name":"Omen of Sinistral Exaltation","img":"omen-VoodooOmen safe"},{"name":"Omen of Catalysing Exaltation","img":"omen-OmenOnExaltConsumeQuality","how":"Usar um Exalted Orb em anel/amuleto com qualidade de Catalyst.","price":0.04559,"trig":"Exalted Orb","trigPrice":0.002318,"risk":"safe"},{"name":"Omen of the Blessed","img":"omen-OmenOnDivineRerollImplicits","how":"Usar um Divine Orb (rerrola só os implícitos).","price":0.2646,"trig":"Divine Orb","trigPrice":1,"risk":"safe"},{"name":"Omen of Sanctification","img":"omen-OmenOnDivineSanctify","how":"Usar um Divine Orb em um Rare (o item fica Sanctified).","price":1.1,"trig":"Divine Orb","trigPrice":1,"risk":"safe"},{"name":"Omen of Chance","img":"omen-OmenOnChanceNotDestroy","how":"Usar um Orb of Chance (o item não é destruído).","price":12.41,"trig":"Orb of Chance","trigPrice":0.02263,"risk":"safe"},{"name":"Omen of Answered Prayers","img":"omen-VoodooOmens4Blue","how":"Clicar em um Shrine (efeito extra).","price":0.08885,"trig":null,"trigPrice":0,"risk":"safe"},{"name":"Omen of Secret Compartments","img":"omen-VoodooOmens4Dark","how":"Abrir um Strongbox (ele pode ser reaberto).","price":0.6787,"trig":null,"trigPrice":0,"risk":"safe"},{"name":"Omen of the Hunt","img":"omen-VoodooOmens4Green","how":"Matar um monstro Possessed (libera todos os Azmeri Spirits).","price":1.88,"trig":null,"trigPrice":0,"risk":"safe"},{"name":"Omen of Reinforcements","img":"omen-VoodooOmens4Purple","how":"Encontrar um Rogue Exile (ele invoca um aliado).","price":0.07244,"trig":null,"trigPrice":0,"risk":"safe"}],"trees":[{"id":"ritual","name":"Ritual","max":36,"img":"atlas-ritual","where":"Caer Tarth — bem a oeste do início do Atlas, depois do The Withered Willow."},{"id":"delirium","name":"Delirium","max":31,"img":"atlas-delirium","where":"The Withered Willow — perto, a oeste do início do Atlas."},{"id":"abyss","name":"Abyss","max":35,"img":"atlas-abyss","where":"Well of Souls — perto, a leste do início do Atlas."}],"bosses":[{"id":"xesht","name":"Xesht, We That Are One","mech":"Breach","img":"atlas-breach","key":"breachstone","drop":"xesht-drop","steps":["Jogue Breaches nos mapas e junte Breach Splinters.","Com a pilha completa, os splinters viram um Wombgift especial.","Leve o Wombgift à Genesis Tree (Monastery of the Keepers) para criar um Breachstone.","Use o Breachstone e siga a linha de quests do Breach até o confronto com o Xesht."],"tip":"Arena que encolhe e golpes de tentáculo pesados: dano consistente e mobilidade. Drop marcante: Hand of Wisdom and Action."},{"id":"atziri","name":"Atziri, the Red Queen","mech":"Vaal Temple","img":"atziri-core","key":"atziri-core","drop":"atziri-drop","steps":["Vá a Lira Vaal, a nordeste do início do Atlas.","Construa o Temple of Atziri colocando salas e avance pelo templo.","Derrote o Royal Architect e abra o acesso à câmara real.","Enfrente Atziri na câmara final."],"tip":"É a fonte das Orbs of Sacrifice (Yaomac's, Kopec's, Kamasa's, Yugul's)."},{"id":"aberration","name":"The Aberration","mech":"Expedition","img":"atlas-expedition","key":"triskelion","drop":"aberration-drop","steps":["Faça a quest The Starlit Rite: fale com Farrow do lado de fora das Lost Catacombs.","Use Expedition Logbooks de nível 79+ e derrote Uhtred.","Rode o Logbook de Olroth, mate Olroth e pegue o Shattered Triskelion.","Reforje na Verisium Anvil (The Triskelion Reforged) e abra a Verisium Crater."],"tip":"Duas fases: aos 75% de vida ela se cura e ganha mobilidade; lasers que seguem você. Dropa Starlit Ore (vira uniques no Runeforging)."}],"mechanics":[{"img":"tile-campaign","t":"Rituais em toda a campanha","d":"Cada área da campanha tem um Ritual que dá currency de crafting e equipamento para o leveling. Duas vezes por ato (e uma por Interlude) aparecem clusters de Ritual Effigies no mapa-múndi: a efígie fica em cima do chefe da área. O chefe derrotado é levado para o próximo Ritual do cluster, somando ondas de chefes cada vez mais perigosas. No fim da série você gasta Tribute em Uniques."},{"img":"tile-wildwood","t":"Sacred Bloom e Viridian Wildwood","d":"Sacred Blooms saem como recompensa de Ritual (só nesta liga) e adicionam o Viridian Wildwood a um grupo de mapas. Lá dentro você segue trilhas de Wisps e coleta; ao sair, os monstros do mapa ficam mais fortes e mais recompensadores conforme os Wisps coletados. Usar mais de um Ritual Tablet aumenta os Azmeri Wisps coletados."},{"img":"tile-cores","t":"Novas Soul Cores","d":"Jiquani's Soul Cores dão +1 nível a um tipo de skill na arma (Totem, Curse, Mark, Warcry, Herald, Strike, Nova, Slam, Grenade, Hazard, Plant, Wind, Storm). Atziri's Soul Cores escalam com itens corrompidos equipados."},{"img":"tile-chaos","t":"Trial of Chaos refeito","d":"Dá para sair e voltar, cada sala tem baú, modificadores mais leves e explícitos, e as recompensas finais agora são só Currency e Soul Cores."}],"sources":[["PoE2DB — Forbidden Rites challenges","https://poe2db.tw/us/Forbidden_Rites_challenges"],["GGG — 0.5.5 Patch Notes","https://www.pathofexile.com/forum/view-thread/4000864"],["GGG — 0.5.0 Patch Notes","https://www.pathofexile.com/forum/view-thread/3932540"],["Game8 — Forbidden Rites Challenges","https://game8.co/games/Path-of-Exile-2/archives/618598"],["Game8 — Forbidden Rites Walkthrough","https://game8.co/games/Path-of-Exile-2/archives/618597"],["PoE2DB — Omens","https://poe2db.tw/us/Omen"],["poe.ninja — Forbidden Rites economy","https://poe.ninja/poe2/economy"]],"leagueEnd":"2026-12-11T20:00:00Z","challenges":[{"id":"riteseeker","name":"The Riteseeker","icon":"ritual-node","art":"ban-riteseeker","goal":11,"kind":"rites","req":"Banish each Rite by completing Rituals in the Campaign","reqpt":"Banir cada Rite completando os Rituais da campanha (11).","phase":"Campanha · Atos 1–4 e Interludes","effort":"Fácil, mas atrasa a campanha","steps":["Os Rites começam sozinhos: a quest liga assim que você entra em Clearfell na liga Forbidden Rites.","No mapa-múndi, procure o cluster de Ritual Effigies (2 por ato, 1 por Interlude). Em cada área do cluster, a efígie fica em cima do chefe.","Derrote o chefe junto do Ritual. Ele é levado para o próximo Ritual do cluster e volta como onda extra — cada área fica mais difícil que a anterior.","Ao terminar o último Ritual do cluster, escolha 1 Unique com o Tribute. Essa escolha também conta para The Reliquarian."],"tips":["Não pule: voltar depois custa mais tempo do que fazer no caminho.","O último chefe do cluster vem com todos os anteriores: suba resistências e vida antes (use as currencies que os Rituais dão).","Em grupo, cada jogador ganha o próprio Tribute e a própria seleção de recompensas."]},{"id":"hunter","name":"The Hunter","icon":"rare-icon","art":"ban-hunter","goal":15,"kind":"rares","req":"Defeat 15 of these named Rare Monsters in the Campaign","reqpt":"Derrotar 15 destes 20 monstros Rare com nome na campanha.","phase":"Campanha","effort":"Fácil com atenção ao mapa","steps":["Cada Rare fica perto de um ponto de interesse da área (na lista abaixo). Quase todos estão perto de checkpoints.","Explore a área inteira quando ela tiver um alvo: o nome aparece na barra de vida do monstro.","Marque aqui ao matar. Você precisa de 15 — existem 20 opções."],"tips":["Os Atos 1–4 têm 14 alvos e a Khari Crossing (Interlude 2) tem mais 3: ao sair da Khari Crossing já dá para ter 17.","O Abandoned Prison (Ato 4) tem dois alvos: Fallen Quartermaster e Forael.","Harano só aparece em Ngakanu depois da quest principal de Arastas."]},{"id":"ascendant","name":"The Ascendant","icon":"trial-sekhemas","art":"ban-ascendant","goal":4,"kind":"trials","req":"Earn all 8 Ascendancy Points by completing the Trials of Ascendancy","reqpt":"Ganhar os 8 pontos de ascendência completando as 4 provas.","phase":"Ato 2 → mapas de nível 75+","effort":"Médio; a prova final é o teste","steps":["1ª e 2ª: fazem parte da campanha (Sekhemas no Ato 2, Chaos no Ato 3).","3ª e final: escolha o caminho que combina com a sua build. Sekhemas usa Djinn Barya (Honour é a sua barra de vida na prova); Chaos usa Inscribed Ultimatum.","O nível da chave define o nível da prova: guarde Baryas e Ultimatums de nível 60+ (3ª) e 75+ (final) que caem nos mapas."],"tips":["Builds com muito dano em área e sustain costumam preferir Chaos; builds com defesa forte contra hits costumam preferir Sekhemas.","Não gaste a chave boa numa prova cujos modificadores ainda te matam: faça uma de nível menor antes para aprender."]},{"id":"master","name":"The Master","icon":"ritual-node","art":"ban-master","goal":90,"kind":"level","req":"Reach Level 90","reqpt":"Chegar ao nível 90.","phase":"Endgame","effort":"Longo, sem segredo","steps":["Suba de tier de mapa conforme a build aguenta: a experiência por mapa cresce muito com o nível da área.","Morrer custa experiência no endgame. Consistência vale mais que velocidade.","Use o Viridian Wildwood (Sacred Bloom): os Wisps deixam os monstros do mapa mais fortes e mais recompensadores."],"tips":["Omen of Amelioration evita 75% da perda de XP ao morrer — e ainda conta para The Nameless."]},{"id":"reliquarian","name":"The Reliquarian","icon":"ritual-tablet","art":"ban-reliquarian","goal":50,"kind":"counter","req":"Receive 50 Unique Items from Rituals","reqpt":"Receber 50 Uniques de Rituais.","phase":"Campanha + mapas","effort":"Médio; anda junto com The Nameless","steps":["Campanha: cada um dos 11 Rites termina com a escolha de 1 Unique — são até 11 ainda no leveling.","Endgame: todas as recompensas da tela do Ritual são Uniques ou Omens. Compre os Uniques (qualquer um conta) e use os Omens para The Nameless.","Ritual Tablets: usar mais de um no mapa adiciona um altar extra quando possível.","Árvore do Atlas de Ritual: Tempting Offers (reroll extra e mais barato), Magnanimous Offerings (chance de reroll grátis) e Hour of the Nameless (uniques valiosos no Rite of the Nameless)."],"tips":["Deferir favores ajuda a juntar Tribute; o novo notable Royal Lenience deixa usar o Tribute já oferecido ao King para deferir.","Não precisa ser caro: uniques baratos contam igual."]},{"id":"nameless","name":"The Nameless","icon":"omen-VoodooOmens4Purple","art":"ban-nameless","goal":18,"kind":"omens","req":"Use 18 of these Ritual Omens","reqpt":"Usar 18 destes 24 Omens de Ritual.","phase":"Mapas iniciais","effort":"Barato se escolher bem","steps":["O Omen só conta quando é consumido: deixe-o no inventário e faça a ação que o ativa (coluna Como ativar).","Pegue nos altares de Ritual ou compre no Currency Exchange. O planejador abaixo escolhe os 18 mais baratos somando o Omen e a currency que o ativa.","Ative um por vez: Omens que reagem à mesma ação podem ser consumidos juntos."],"tips":["Hardcore: o Omen of Amelioration só ativa morrendo, e morrer no HC leva o personagem para o Standard. Ligue o filtro Hardcore.","Refreshment e Resurgence ativam em Low Life: faça num mapa fácil.","Evite os caros (Annulment, Erasure, Whittling, Chance): com 24 opções você não precisa deles."]},{"id":"cartographer","name":"The Cartographer","icon":"atlas-ritual","art":"ban-cartographer","goal":3,"kind":"trees","req":"Fully Allocate these League Atlas Passive Trees","reqpt":"Alocar por completo as árvores de Ritual (36), Delirium (31) e Abyss (35).","phase":"Endgame","effort":"O mais longo","steps":["Os pontos de cada árvore vêm de completar mapas na região daquela mecânica.","Delirium: The Withered Willow (perto, a oeste). Abyss: Well of Souls (perto, a leste). Ritual: Caer Tarth (longe, a oeste, depois do Willow).","Aloque os pontos assim que ganhar: a challenge pede as árvores totalmente alocadas."],"tips":["Faça Ritual primeiro: Tempting Offers e Magnanimous Offerings aceleram The Reliquarian e The Nameless.","O Game8 cita 32 nós de Delirium; os dados do jogo (PoE2DB) mostram 31."]},{"id":"vanquisher","name":"The Vanquisher","icon":"breachstone","art":"ban-vanquisher","goal":3,"kind":"bosses","req":"Defeat these Endgame Pinnacle Bosses","reqpt":"Derrotar 3 chefes pinnacle: Xesht, Atziri e The Aberration.","phase":"Endgame avançado","effort":"Difícil","steps":["Cada chefe te
