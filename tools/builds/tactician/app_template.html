<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Oswald:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#07080B; --ground2:#0B0C11; --stone:#0E0F16; --stone2:#11141D; --stone3:#161925;
  --edge:#21263D; --edge2:#2C3760; --gild:#7292CA; --gild-hi:#ACC0E3; --gild-g:rgba(114,146,202,.14);
  --text:#B4C5E3; --mute:#597FC0; --faint:#474F70;
  --unique:#AF6025; --rare:#FFFF77; --magic:#8888FF; --gem:#1BA29B; --normal:#C8C8C8; --corrupt:#D20000;
  --wisp:#7FD7D8; --wisp-g:rgba(127,215,216,.14); --bear:#AA7BE0; --bear-g:rgba(170,123,224,.16);
  --set1:#D9544A; --set2:#62B462; --danger:#E0664F; --danger-g:rgba(224,102,79,.14);
  --display:"Marcellus","Cinzel","Trajan Pro",Georgia,serif;
  --ui:"Marcellus SC","Palatino Linotype",Georgia,serif;
  --body:"Spectral","Palatino Linotype",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--text)}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.5;min-height:100vh;
  background:
    radial-gradient(1100px 600px at 78% -8%,rgba(170,123,224,.10),transparent 60%),
    radial-gradient(900px 520px at 8% 0%,rgba(127,215,216,.07),transparent 60%),
    radial-gradient(1400px 900px at 50% 120%,rgba(114,146,202,.06),transparent 60%),
    var(--ground)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gild);outline-offset:2px}
a{color:var(--gild-hi)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.04em;text-wrap:balance;margin:0;color:var(--gild-hi)}
.ui{font-family:var(--ui)}
.mono{font-family:var(--mono)}
.label{font-family:var(--ui);font-size:.8rem;letter-spacing:.12em;color:var(--mute)}
img{max-width:100%}

/* ---------- ornate panel (PoE frame) */
.frame{position:relative;background:linear-gradient(180deg,var(--stone2),var(--stone));border:1px solid var(--edge);box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 1px 0 rgba(172,192,227,.06),0 8px 24px rgba(0,0,0,.35)}
.frame::before,.frame::after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--gild);background:var(--ground);transform:rotate(45deg);top:-5px;pointer-events:none}
.frame::before{left:-5px}.frame::after{right:-5px}
.plate{font-family:var(--display);font-weight:700;letter-spacing:.08em;color:var(--gild-hi);text-align:center;padding:8px 14px;
  background:linear-gradient(90deg,transparent,rgba(114,146,202,.14) 20%,rgba(114,146,202,.22) 50%,rgba(114,146,202,.14) 80%,transparent);
  border-top:1px solid var(--edge2);border-bottom:1px solid var(--edge2)}
.divider{height:10px;margin:10px 0;background:
  linear-gradient(90deg,transparent,var(--edge2) 15%,var(--gild) 50%,var(--edge2) 85%,transparent) center/100% 1px no-repeat}
.divider.orn{position:relative}
.divider.orn::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;background:var(--gild);transform:translate(-50%,-50%) rotate(45deg)}

/* ---------- layout */
.app{display:grid;grid-template-columns:84px minmax(0,1fr);min-height:100vh}
@media (min-width:1440px){.app{grid-template-columns:84px minmax(0,1fr) 360px}}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--edge);background:linear-gradient(180deg,#090A0F,#060608);display:flex;flex-direction:column;align-items:center;padding:16px 0 12px;gap:6px}
.rail .lv-top,.rail .lv-bot{font-family:var(--ui);font-size:.72rem;color:var(--faint)}
.totem{position:relative;flex:1;width:100%;margin:6px 0}
.totem .spine{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:var(--edge)}
.totem .fillbar{position:absolute;left:50%;top:0;width:2px;transform:translateX(-50%);background:linear-gradient(var(--wisp),var(--gild));box-shadow:0 0 12px var(--gild);transition:height .6s cubic-bezier(.2,.8,.2,1)}
.totem button.node{position:absolute;left:50%;transform:translate(-50%,-50%) rotate(45deg);width:12px;height:12px;background:var(--ground);border:1px solid var(--edge2);cursor:pointer;padding:0;transition:all .3s}
.totem button.node:hover{border-color:var(--gild)}
.totem button.node.done{background:var(--edge2);border-color:var(--gild)}
.totem button.node.cur{width:18px;height:18px;border-color:var(--gild-hi);background:var(--gild-g);box-shadow:0 0 14px var(--gild)}
.totem .tip{position:absolute;left:calc(50% + 18px);transform:translateY(-50%);white-space:nowrap;font-family:var(--ui);font-size:.78rem;color:var(--text);pointer-events:none;opacity:0;transition:opacity .2s;background:var(--stone);border:1px solid var(--edge2);padding:2px 8px;z-index:30}
.totem button.node:hover + .tip,.totem button.node:focus-visible + .tip{opacity:1}
.totem .you{position:absolute;left:50%;transform:translate(-50%,-50%);pointer-events:none;transition:top .6s cubic-bezier(.2,.8,.2,1)}
.totem .you span{display:block;width:34px;height:34px;border-radius:50%;border:1px dashed var(--wisp);animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{padding:24px clamp(16px,2.6vw,40px) 80px;min-width:0}

/* ---------- console */
.console{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:26px;align-items:stretch;padding-bottom:22px}
.brand{display:flex;flex-direction:column;justify-content:flex-end}
.brand .eyebrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand .pill{font-family:var(--ui);border:1px solid var(--edge2);padding:1px 10px;font-size:.82rem;color:var(--gild-hi);background:rgba(114,146,202,.08)}
.brand .pill.league{color:#A0BAE7;border-color:#233168;background:rgba(53,74,159,.14)}
.brand h1{font-size:clamp(2.1rem,4.4vw,3.9rem);line-height:1.02;margin-top:12px;font-weight:900;
  background:linear-gradient(180deg,#D0DCF2 0%,#88A3D2 48%,#3F65A7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 2px 30px rgba(114,146,202,.18)}
.brand h1 small{display:block;font-family:var(--ui);font-weight:500;font-size:.36em;letter-spacing:.2em;color:var(--mute);-webkit-text-fill-color:var(--mute);margin-bottom:4px}
.brand p{color:var(--mute);max-width:60ch;margin:12px 0 0}
.where{padding:16px 18px;display:grid;gap:12px;overflow:hidden}
.where canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.7}
.where > *:not(canvas){position:relative}
.lvrow{display:flex;align-items:center;gap:16px}
.orbLv{flex:none;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 40% 35%,#141B3B,#060914 70%);border:2px solid var(--edge2);box-shadow:inset 0 0 18px #000000,0 0 0 4px #05060B,0 0 22px rgba(114,146,202,.2)}
.orbLv b{font-family:var(--display);font-size:2.3rem;font-weight:900;color:var(--gild-hi);line-height:1}
.orbLv small{position:absolute;bottom:10px;font-family:var(--ui);font-size:.62rem;letter-spacing:.18em;color:var(--mute)}
.lvrow .meta{flex:1;min-width:0}
.lvrow .ph{font-family:var(--display);font-size:1.35rem;color:var(--gild-hi)}
.lvrow .tg{color:var(--mute);font-family:var(--ui);font-size:.95rem}
.step{display:flex;gap:6px}
.step button{width:36px;height:36px;border:1px solid var(--edge2);background:linear-gradient(#161B2D,#0C0E18);cursor:pointer;font-family:var(--display);font-weight:900;color:var(--gild-hi)}
.step button:hover{border-color:var(--gild)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;background:linear-gradient(90deg,var(--gild) var(--p,35%),#1A1D2C var(--p,35%));border:1px solid #000000}
input[type=range]::-moz-range-track{height:6px;background:#1A1D2C}
input[type=range]::-moz-range-progress{height:6px;background:var(--gild)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;background:var(--gild-hi);border:2px solid #0A0E1C;margin-top:-7px;transform:rotate(45deg);box-shadow:0 0 10px var(--gild)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--gild-hi);border:2px solid #0A0E1C}
.ticks{display:flex;justify-content:space-between;font-family:var(--ui);font-size:.72rem;color:var(--faint);margin-top:-4px}
.mode{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--edge2);padding:3px;position:relative;background:#06070C}
.mode button{border:0;background:transparent;padding:7px 10px;cursor:pointer;font-family:var(--ui);font-weight:700;font-size:1rem;position:relative;z-index:1;transition:color .25s;color:var(--mute)}
.mode button[aria-pressed=true]{color:#060913}
.mode .slide{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);background:linear-gradient(#9FE5E6,#4FA2A3);transition:transform .35s cubic-bezier(.2,.8,.2,1),background .35s}
.mode.full .slide{transform:translateX(100%);background:linear-gradient(#AEC4EA,#4871B9)}
.mode small{display:block;font-weight:400;font-size:.74rem;opacity:.85}

/* ---------- tabs */
nav.tabs{position:sticky;top:0;z-index:20;margin:0 calc(-1*clamp(16px,2.6vw,40px));padding:8px clamp(16px,2.6vw,40px);background:rgba(7,8,11,.92);backdrop-filter:blur(10px);border-top:1px solid var(--edge);border-bottom:1px solid var(--edge);display:flex;flex-wrap:wrap;gap:2px;overflow:visible}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:1px solid transparent;background:transparent;color:var(--mute);padding:6px 13px;cursor:pointer;white-space:nowrap;font-family:var(--ui);font-weight:700;font-size:1.02rem;transition:all .2s}
nav.tabs button:hover{color:var(--gild-hi)}
nav.tabs button[aria-selected=true]{color:var(--gild-hi);border-color:var(--edge2);background:linear-gradient(180deg,rgba(114,146,202,.16),rgba(114,146,202,.03));box-shadow:inset 0 -2px 0 var(--gild)}
nav.tabs .count{font-family:var(--mono);font-size:.72rem;color:var(--wisp);margin-left:5px}

section.view{display:none;padding-top:24px;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
section.view.on{display:block}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
.stagger > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.stagger > *:nth-child(2){animation-delay:.04s}.stagger > *:nth-child(3){animation-delay:.08s}.stagger > *:nth-child(4){animation-delay:.12s}.stagger > *:nth-child(5){animation-delay:.16s}.stagger > *:nth-child(n+6){animation-delay:.2s}
.sechead{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sechead h2{font-size:1.8rem}
.sechead p{color:var(--mute);margin:4px 0 0;max-width:72ch}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{padding:18px}
.panel h3{font-size:1.1rem;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 9px;font-family:var(--ui);font-size:.85rem;font-weight:700;border:1px solid var(--edge2);color:var(--mute);white-space:nowrap;background:rgba(0,0,0,.25)}
.chip.wisp{color:var(--wisp);border-color:rgba(127,215,216,.35);background:var(--wisp-g)}
.chip.gold{color:var(--gild-hi);border-color:rgba(114,146,202,.45);background:var(--gild-g)}
.chip.unique{color:#84A6E1;border-color:rgba(53,74,159,.6);background:rgba(53,74,159,.14)}
.chip.danger{color:var(--danger);border-color:rgba(224,102,79,.4);background:var(--danger-g)}
.chip.bear{color:var(--bear);border-color:rgba(170,123,224,.4);background:var(--bear-g)}
.chip.s1{color:var(--set1);border-color:rgba(217,84,74,.45)} .chip.s2{color:var(--set2);border-color:rgba(98,180,98,.45)}
ul.clean{list-style:none;padding:0;margin:0;display:grid;gap:8px}
ul.clean li{display:flex;gap:10px;align-items:flex-start}
ul.clean li::before{content:"";flex:none;width:6px;height:6px;margin-top:.6em;background:var(--wisp);transform:rotate(45deg)}
ul.clean.gold li::before{background:var(--gild)}
ul.clean.danger li::before{background:var(--danger)}

/* agora */
.now{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.nowcard{padding:22px;overflow:hidden}
.nowcard .goal{font-size:1.28rem;line-height:1.38;margin:8px 0 14px;max-width:56ch;color:var(--text)}
.nowcard .ms{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:baseline}
.nowcard .ms .n{font-family:var(--ui);color:var(--gild-hi);font-weight:700}
.nowcard .ms .n.next{color:var(--wisp)}
.split .bar{display:flex;height:12px;overflow:hidden;background:#151826;border:1px solid #000000}
.split .bar i{display:block;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.split .bar i.p{background:linear-gradient(#e6e6e6,#9a9a9a)}
.split .bar i.z{background:linear-gradient(#A6EBEC,#3F8B8C)}
.split .legend{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--ui);font-size:.88rem;color:var(--mute);margin-top:6px}
.checklist{display:grid;gap:4px}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;cursor:pointer;transition:background .2s}
.check:hover{background:rgba(114,146,202,.06)}
.check input{appearance:none;flex:none;width:17px;height:17px;margin-top:4px;border:1px solid var(--edge2);background:#06070C;cursor:pointer;display:grid;place-items:center;transform:rotate(45deg);transition:all .2s}
.check input:checked{background:var(--gild);border-color:var(--gild-hi);box-shadow:0 0 10px var(--gild)}
.check.done span{color:var(--faint);text-decoration:line-through}

/* gems */
.gems{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.gem{padding:14px;display:grid;gap:10px;align-content:start;transition:transform .2s,border-color .2s}
.gem:hover{transform:translateY(-2px);border-color:var(--edge2)}
.gem.carry{border-color:#384782;background:linear-gradient(160deg,rgba(114,146,202,.12),var(--stone) 60%)}
.gem .top{display:flex;gap:12px;align-items:center}
.gicon{flex:none;width:52px;height:52px;display:grid;place-items:center;background:radial-gradient(circle,#1d2a28,#0B0F0F);border:1px solid #2f4b47}
.gicon img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(27,162,155,.45))}
.gicon .ph{font-family:var(--display);color:var(--gem);font-size:1.3rem}
.gem .name{font-family:var(--ui);font-weight:700;font-size:1.1rem;color:var(--gem);line-height:1.15}
.gem.carry .name{color:#9FE7E1}
.gem .role{font-size:.9rem;color:var(--mute)}
.spc{display:inline-block;margin-top:5px;padding:2px 8px;font-family:var(--ui);font-size:.76rem;font-weight:700;border:1px solid var(--edge2);color:var(--mute)}
.spc.core{border-color:#304492;color:var(--gild-hi);background:rgba(114,146,202,.1)}
.spc.free{border-color:#2F5A5B;color:#8FD8D9}
.spc.opt{border-style:dashed;color:var(--faint)}
.gem.optional{opacity:.78;border-style:dashed}
.gem.optional:hover{opacity:1}
.spgroup{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px;font-family:var(--ui);font-weight:700;color:var(--gild-hi);font-size:1.02rem}
.spgroup:first-child{margin-top:0}
.spgroup small{font-weight:400;color:var(--mute);font-family:var(--body);font-size:.88rem}
.skbox{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 14px;margin-bottom:16px;border-color:#4a6a7a;background:linear-gradient(90deg,rgba(143,208,255,.08),transparent)}
.skbox .big{font-family:var(--display);font-weight:900;font-size:2rem;color:#cfe9ff;line-height:1;text-align:center;min-width:64px}
.skbox .big small{display:block;font-family:var(--ui);font-size:.7rem;font-weight:700;color:var(--mute);letter-spacing:.06em;margin-top:4px}
.skbox .types{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.skbox .types span{padding:2px 8px;border:1px solid #4a6a7a;font-family:var(--ui);font-size:.82rem;color:#cfe9ff}
.skbox p{margin:0;color:var(--text);font-size:.93rem}
.sb-skel{display:flex;gap:8px;align-items:baseline;font-family:var(--ui);font-size:.86rem;color:var(--mute)}
.sb-skel b{color:#cfe9ff;font-size:1rem}
.charwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start;margin-top:16px}
@media (max-width:1100px){.charwrap{grid-template-columns:1fr}}
.recs{position:sticky;top:12px;display:grid;gap:8px}
.rec{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:9px 10px;border:1px solid var(--edge);background:#090A10;cursor:pointer}
.rec .ri{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;font-weight:900;font-family:var(--ui);font-size:.8rem}
.rec b{display:block;font-family:var(--ui);color:var(--text);font-size:.95rem;line-height:1.2}
.rec small{display:block;color:var(--mute);font-size:.84rem;margin-top:3px;line-height:1.3}
.rec.bad{border-color:rgba(224,102,79,.55)}.rec.bad .ri{background:#5a1d14;color:#ffb3a3}
.rec.warn{border-color:#384782}.rec.warn .ri{background:#19244D;color:var(--gild-hi)}
.rec.tip{border-color:#2f5b6c}.rec.tip .ri{background:#15323d;color:#9fd2ff}
.rec.ok{opacity:.8}.rec.ok .ri{background:#153334;color:#8FD8D9}
.rec.mini{padding:6px 8px;grid-template-columns:22px 1fr}.rec.mini .ri{width:20px;height:20px;font-size:.7rem}.rec.mini b{font-size:.84rem}
.chkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.chk{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid var(--edge);cursor:pointer;font-family:var(--ui);font-size:.88rem;color:var(--text)}
.chk:has(input:checked){border-color:#304492;background:rgba(114,146,202,.08)}
.chk input{accent-color:#7292CA}
.chk img{width:26px;height:26px;object-fit:contain}
.chk .px{margin-left:auto;font-family:var(--mono);font-size:.7rem;color:var(--gild)}
.petrow{display:grid;grid-template-columns:auto minmax(0,1.4fr) minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}
@media (max-width:600px){.petrow{grid-template-columns:1fr 1fr}}
.petrow .px{font-family:var(--mono);font-size:.76rem;color:var(--gild);white-space:nowrap}
.charstat{margin-top:6px}
.stagesel{display:grid;gap:3px;margin-top:8px}
.stagesel span{font-family:var(--ui);font-size:.72rem;color:var(--mute);letter-spacing:.04em}
.stagesel select{max-width:260px}
.lvwarn{margin:6px 12px 0;padding:5px 8px;border:1px solid rgba(224,102,79,.55);color:#ffb3a3;font-family:var(--ui);font-size:.8rem}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
@media (max-width:600px){.qgrid{grid-template-columns:1fr}}
.qcard{padding:14px;display:grid;gap:8px;align-content:start}
.qcard.lock{border-color:rgba(224,102,79,.35)}
.qcard.have{border-color:#2F5A5B}
.qh{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center}
.qh img{width:48px;height:48px;object-fit:contain}
.qh .qi{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--edge2);font-family:var(--display);color:var(--gild-hi)}
.qh h3{margin:0;font-size:1.05rem}
.qh small{color:var(--mute);font-size:.8rem}
.qst{padding:3px 8px;font-family:var(--ui);font-size:.74rem;font-weight:700;border:1px solid var(--edge2);white-space:nowrap}
.qst.lock{border-color:rgba(224,102,79,.6);color:#ffb3a3}
.qst.ok{border-color:#304492;color:var(--gild-hi)}
.qst.have{border-color:#2F5A5B;color:#8FD8D9}
.qrow b{display:block;font-family:var(--ui);font-size:.8rem;color:var(--gild);letter-spacing:.03em}
.qrow p{margin:2px 0 0;font-size:.92rem}
.qrow ol,.qrow ul{margin:4px 0 0;padding-left:18px;font-size:.9rem;display:grid;gap:3px}
.qrow.early b{color:#9fd2ff}.qrow.late b{color:#809FD4}.qrow.watch b{color:#ffb3a3}
.adaptbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:10px 14px;margin:14px 0;border-color:var(--edge2)}
.adaptbar.on{border-color:#2F5A5B;background:linear-gradient(90deg,rgba(127,215,216,.08),transparent)}
.adaptbar ul{flex-basis:100%;margin:0;padding-left:18px;display:grid;gap:3px;font-size:.9rem;color:var(--text)}
.adaptbar b{flex-basis:100%;font-family:var(--ui);color:#8FD8D9}
.adaptbar a{color:#9fd2ff}
.havebadge{margin:6px 12px 0;padding:4px 8px;border:1px solid #2F5A5B;color:#8FD8D9;font-family:var(--ui);font-size:.8rem}
.missbadge{margin:6px 12px 0;padding:4px 8px;border:1px dashed var(--edge2);color:var(--mute);font-family:var(--ui);font-size:.8rem}
.spc.nofit{border-color:rgba(224,102,79,.6);color:#ffb3a3;margin-left:6px}
.huntol{margin:0;padding-left:20px;display:grid;gap:6px}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.spnote{padding:12px 14px;margin-bottom:16px;border-color:#304492;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:linear-gradient(90deg,rgba(114,146,202,.1),transparent)}
.spnote b{font-family:var(--display);color:var(--gild-hi);font-size:1rem}
.spnote p{margin:0;color:var(--text)}
.runes .sock-list{display:grid;gap:3px;margin-top:3px}
.runes .sock-list span::before{content:"◇ ";color:var(--gild)}
.nextpts{display:grid;gap:4px;padding:6px}
.nextpts li{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;cursor:pointer;padding:3px 4px}
.nextpts li:hover{background:rgba(143,208,255,.08)}
.nextpts .no{display:grid;place-items:center;width:22px;height:22px;border:1px solid #6fb2e6;color:#9fd2ff;font-family:var(--mono);font-size:.72rem;border-radius:50%}
.nextpts .nb{font-family:var(--ui);color:var(--text);font-size:.9rem;line-height:1.15}
.nextpts .nb small{display:block;color:var(--mute);font-size:.76rem}
.nextpts .nb.big{color:#9fd2ff;font-weight:700}
.ptsrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--edge)}
.ptsrow input{width:74px}
.ptsrow .btn{padding:4px 10px}

.links{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sock{display:inline-flex;align-items:center;gap:7px;font-family:var(--ui);font-size:.92rem;padding:2px 10px 2px 2px;background:#07080D;border:1px solid var(--edge)}
.sock img{width:24px;height:24px;border-radius:50%;background:#0B0D16;border:1px solid #242D4F}
.sock.new{border-color:rgba(114,146,202,.6);box-shadow:0 0 0 1px rgba(114,146,202,.2)}
.sock.new span{color:var(--gild-hi)}
.gem .diff{font-family:var(--ui);font-size:.85rem;color:var(--gild-hi)}
.gem .diff.rem{color:var(--faint)}

/* timeline */
.timeline{display:grid;grid-template-columns:repeat(8,minmax(150px,1fr));gap:10px;overflow-x:auto;padding:6px 6px 10px}
.tl{padding:12px;cursor:pointer;text-align:left;display:grid;gap:8px;align-content:start;transition:all .25s;color:inherit}
.tl:hover{border-color:var(--edge2)}
.tl.cur{border-color:var(--gild);box-shadow:0 0 0 1px var(--gild),0 0 22px rgba(114,146,202,.25)}
.tl .lv{font-family:var(--ui);font-size:.82rem;color:var(--faint)}
.tl .nm{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.1;color:var(--gild-hi)}
.tl .tg{font-size:.88rem;color:var(--mute)}
.tl .mini{height:5px;background:#151826;overflow:hidden;display:flex}
.tl .mini i.p{background:#bdbdbd}.tl .mini i.z{background:var(--wisp)}
.levels{max-height:540px;overflow:auto}
.lvl{display:grid;grid-template-columns:56px 130px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid #131624;cursor:pointer}
.lvl:hover{background:rgba(114,146,202,.05)}
.lvl .n{font-family:var(--ui);color:var(--faint);font-weight:700}
.lvl .p{color:var(--mute);font-family:var(--ui);font-size:.85rem}
.lvl.ms .t{font-weight:700}
.lvl.none .t{color:var(--faint)}
.lvl.cur{background:var(--gild-g)}
.lvl.cur .n{color:var(--gild-hi)}
.lvl.past .t{color:var(--faint)}

/* tables */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{font-family:var(--ui);font-size:.85rem;letter-spacing:.06em;color:var(--gild);text-align:left;padding:10px 12px;border-bottom:1px solid var(--edge2);background:#0B0D13;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid #131624;vertical-align:top}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* item tooltip (PoE) */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tt{background:rgba(0,0,0,.86);border:1px solid #1D2852;display:grid;align-content:start;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tt .th{position:relative;text-align:center;padding:8px 10px 7px;font-family:var(--ui);font-weight:700;line-height:1.15;border-bottom:1px solid #1D2852;
  background:linear-gradient(180deg,#13182D,#0B0D17)}
.tt.unique{border-color:#7a4a22}
.tt.unique .th{color:#E18C47;background:linear-gradient(180deg,#131B3A,#080C1A);border-bottom-color:#7a4a22}
.tt.rare .th{color:#95B2E5;background:linear-gradient(180deg,#111832,#090B16)}
.tt .th small{display:block;font-weight:500;font-size:.78rem;color:var(--mute);letter-spacing:.08em}
.tt .body{display:grid;grid-template-columns:80px 1fr;gap:12px;padding:10px 12px}
.tt .art{width:80px;height:96px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(114,146,202,.12),transparent 70%)}
.tt .art img{max-width:78px;max-height:94px;object-fit:contain;filter:drop-shadow(0 4px 8px #000000)}
.tt .mods{font-size:.88rem;color:#9C9CFF;display:grid;gap:2px;align-content:start}
.tt .mods .none{color:var(--faint);font-style:italic}
.tt .runes{padding:0 12px 10px;font-family:var(--ui);font-size:.8rem;color:#7FAFB0}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.slot{padding:14px;display:grid;gap:9px;align-content:start}
.opts{list-style:none;margin:2px 0 0;padding:0;display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 34px minmax(0,1fr);gap:4px 10px;align-items:center;padding:9px 10px;border:1px solid var(--edge2);border-radius:10px;background:rgba(255,255,255,.02)}
.opt.best{border-color:rgba(114,146,202,.65);background:rgba(114,146,202,.10)}
.opt .rk{font-family:var(--ui);font-weight:800;font-size:.8rem;color:var(--mute)} .opt.best .rk{color:var(--gild-hi)}
.opt img,.opt .noimg{width:34px;height:34px;object-fit:contain}
.opt b{display:block;font-size:.95rem;line-height:1.25}
.opt small{display:block;color:var(--mute);line-height:1.4;margin-top:2px;font-size:.84rem}
.opt .ochips{grid-column:2 / -1;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.opt .ochips i{font-style:normal;color:var(--mute);font-size:.8rem}
.chip.rare{color:#e6c979;border-color:rgba(230,201,121,.4);background:rgba(230,201,121,.08)}
.chip.cost-free{color:#86efac;border-color:rgba(134,239,172,.4)} .chip.cost-cheap{color:var(--wisp);border-color:rgba(127,215,216,.35)}
.chip.cost-value{color:#e6c979;border-color:rgba(230,201,121,.4)} .chip.cost-lux{color:#d8a4ff;border-color:rgba(216,164,255,.45)}
.optnext{margin:2px 0 0;color:var(--mute);font-size:.86rem;line-height:1.4} .optnext b{color:var(--text)}
.tier.locked{opacity:.55} .tier .lk{color:var(--mute);font-size:.8rem;margin-left:6px;white-space:nowrap}
.optnone{color:var(--mute);font-size:.88rem;margin:2px 0 0}
.slot .lvnote{font-family:var(--ui);font-size:.8rem;color:var(--mute);margin:0}

.slot .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot .hd b{font-family:var(--display);font-weight:700;color:var(--gild-hi)}
.slot .thumbs{display:flex;gap:4px}
.slot .thumbs img{width:34px;height:34px;object-fit:contain;background:#07080D;border:1px solid var(--edge)}
.tier{display:grid;grid-template-columns:82px 1fr;gap:8px;font-size:.93rem;padding:6px 8px;transition:all .3s;opacity:.5}
.tier.on{opacity:1;background:rgba(0,0,0,.3);border-left:2px solid var(--gild)}
.tier .k{font-family:var(--ui);font-size:.85rem;font-weight:700;color:var(--faint);padding-top:1px}
.tier.cheap.on .k{color:var(--wisp)} .tier.value.on .k{color:var(--normal)} .tier.full.on .k{color:#E18C47}
.slot .note{font-size:.88rem;color:var(--gild-hi);border-top:1px dashed var(--edge);padding-top:8px}
.slot .affix{font-size:.88rem;color:var(--mute)}
.buy{display:grid;gap:8px;padding:0;margin:0}
.buy li{list-style:none;display:grid;grid-template-columns:40px 36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px}
.buy .i{font-family:var(--display);color:var(--gild-hi);font-weight:900}
.buy img{width:34px;height:34px;object-fit:contain}
.buy small{color:var(--mute);display:block}

/* tree */
.treewrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.treebox{position:relative;height:min(76vh,760px);overflow:hidden;background:radial-gradient(circle at 50% 50%,#0C0D13,#060505 80%)}
.treebox canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}
.treebox canvas:active{cursor:grabbing}
.treebar{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
.treebar > *{pointer-events:auto}
.tbtn{border:1px solid var(--edge2);background:rgba(8,10,16,.9);padding:4px 10px;cursor:pointer;font-family:var(--ui);font-weight:700;color:var(--text)}
.tbtn:hover{border-color:var(--gild)}
.tbtn[aria-pressed=true]{color:#060913;background:var(--gild)}
.legend{position:absolute;left:10px;bottom:10px;display:flex;gap:12px;flex-wrap:wrap;font-family:var(--ui);font-size:.85rem;background:rgba(6,6,8,.85);border:1px solid var(--edge);padding:5px 10px}
.legend i{display:inline-block;width:10px;height:10px;transform:rotate(45deg);margin-right:6px;vertical-align:middle}
.ttip{position:absolute;pointer-events:none;max-width:320px;background:rgba(0,0,0,.92);border:1px solid #2A3560;padding:0;z-index:5;display:none}
.ttip .th{font-family:var(--ui);font-weight:700;color:var(--gild-hi);padding:6px 10px;background:linear-gradient(#13182D,#0B0D17);border-bottom:1px solid #2A3560;text-align:center}
.ttip .st{padding:8px 10px;font-size:.88rem;color:#9C9CFF;display:grid;gap:2px}
.nlist{max-height:min(76vh,760px);overflow:auto;padding:10px}
.nrow{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:6px;cursor:pointer;border:1px solid transparent}
.nrow:hover{border-color:var(--edge2);background:rgba(114,146,202,.05)}
.nrow img{width:38px;height:38px;border-radius:50%;border:2px solid #2F3D72;background:#06070C}
.nrow.k2 img{border-radius:0;border-color:var(--gild)}
.nrow b{font-family:var(--ui);font-size:.98rem;color:var(--text);display:block;line-height:1.15}
.nrow small{color:var(--mute);font-size:.8rem;display:block;line-height:1.25}
.nrow.new b{color:var(--wisp)}
.ascbox{position:relative;height:340px;background:radial-gradient(circle,#0E111C,#050507 75%);overflow:hidden}
.ascbox canvas{position:absolute;inset:0;width:100%;height:100%}

/* spirit */
.spirit{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.field{display:grid;gap:4px}
.field span{font-family:var(--ui);font-size:.9rem;color:var(--mute)}
.field input[type=number],select{background:#06070C;border:1px solid var(--edge2);padding:6px 9px;width:100%}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.switch{position:relative;width:44px;height:22px;flex:none}
.switch input{appearance:none;width:44px;height:22px;background:#151826;border:1px solid var(--edge2);cursor:pointer;margin:0;transition:background .25s}
.switch input:checked{background:#18203E}
.switch i{position:absolute;top:4px;left:4px;width:14px;height:14px;background:var(--faint);pointer-events:none;transition:transform .25s;transform:rotate(45deg)}
.switch input:checked + i{transform:translateX(22px) rotate(45deg);background:var(--gild-hi);box-shadow:0 0 8px var(--gild)}
.donut{display:grid;place-items:center;position:relative;margin:6px 0}
.donut .c{position:absolute;text-align:center}
.donut .c b{font-family:var(--display);font-size:2rem;display:block;line-height:1;color:var(--gild-hi)}
.donut .c small{color:var(--mute);font-family:var(--ui)}
.zoo td input{background:#06070C;border:1px solid var(--edge);padding:4px 6px;width:100%}
.zoo td input[type=number]{width:74px}
.zoo td select{padding:4px 6px;width:auto}
.zoo .x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:1.2rem}
.zoo .x:hover{color:var(--danger)}
.btn{border:1px solid var(--edge2);background:linear-gradient(#161B2D,#0C0E18);padding:6px 12px;cursor:pointer;font-family:var(--ui);font-weight:700;color:var(--gild-hi)}
.btn:hover{border-color:var(--gild)}
.status{padding:10px 12px;font-family:var(--ui);font-weight:700;margin-top:10px;border:1px solid}
.status.ok{background:var(--wisp-g);color:var(--wisp);border-color:rgba(127,215,216,.3)} .status.warn{background:var(--gild-g);color:var(--gild-hi);border-color:var(--edge2)} .status.bad{background:var(--danger-g);color:var(--danger);border-color:rgba(224,102,79,.4)}
.bst{display:flex;gap:10px;align-items:center}
.bst img{width:30px;height:30px}

/* asc */
.ascpath{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:relative}
.asc{padding:0 12px;display:grid;gap:8px;justify-items:center;text-align:center;position:relative}
.asc::before{content:"";position:absolute;top:40px;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--bear),var(--gild));z-index:0}
.asc:first-child::before{left:50%} .asc:last-child::before{right:50%}
.asc .medal{position:relative;z-index:1;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;background:#06070C;border:3px solid var(--gild);box-shadow:0 0 0 5px #06070C,0 0 26px rgba(114,146,202,.35);transition:transform .3s;overflow:hidden}
.asc .medal img{width:64px;height:64px;border-radius:50%}
.asc:hover .medal{transform:scale(1.07)}
.asc.locked .medal{border-color:var(--edge);filter:grayscale(.9) brightness(.6);box-shadow:0 0 0 5px #06070C}
.asc .when{font-family:var(--ui);font-size:.88rem;color:var(--bear)}
.asc p{font-size:.92rem;color:var(--mute);margin:0}
.kp{display:grid;grid-template-columns:52px 1fr;gap:12px}
.kp img{width:52px;height:52px;border-radius:50%;border:2px solid #2F3D72}
.kp.k2 img{border-radius:0;border-color:var(--gild)}

/* quests / tricks / misc */
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.ring{--v:0;width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--gild) calc(var(--v)*1%),#151826 0);display:grid;place-items:center}
.ring > div{width:94px;height:94px;border-radius:50%;background:var(--stone);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--display);font-size:1.7rem;line-height:1;color:var(--gild-hi)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--edge2);background:rgba(0,0,0,.3);padding:3px 12px;cursor:pointer;color:var(--mute);font-family:var(--ui);font-weight:700;font-size:.95rem}
.filters button[aria-pressed=true]{background:var(--gild-g);color:var(--gild-hi);border-color:var(--gild)}
.tricks{columns:3 320px;column-gap:14px}
.trick{break-inside:avoid;margin-bottom:14px;padding:14px;display:grid;gap:8px}
.trick h3{font-size:1.02rem}
.trick p{margin:0;font-size:.95rem;color:var(--mute);overflow-wrap:anywhere}
.trick .row{display:flex;gap:6px;flex-wrap:wrap}
details.acc{margin-bottom:10px}
details.acc summary{cursor:pointer;padding:12px 16px;font-family:var(--ui);font-weight:700;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.acc summary::after{content:"+";color:var(--gild)}
details.acc[open] summary::after{content:"–"}
details.acc div{padding:0 16px 14px;color:var(--mute)}
.setup{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}
.setup .panel{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:start}
.setup img{width:150px;border:1px solid var(--edge2)}
.setup b{display:block;margin-bottom:6px;font-family:var(--ui)}
.setup p{margin:0;color:var(--mute);font-size:.95rem}
.atlasgrp{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.foot{margin-top:40px;color:var(--faint);font-size:.88rem;border-top:1px solid var(--edge);padding-top:14px}

.gem .why{margin:0;font-size:.93rem;color:var(--text);line-height:1.45}
.supwhy{border-top:1px dashed var(--edge);padding-top:6px}
.supwhy summary{cursor:pointer;font-family:var(--ui);font-weight:700;color:var(--gild);font-size:.9rem;list-style:none}
.supwhy summary::before{content:"▸ ";color:var(--gild)}
.supwhy[open] summary::before{content:"▾ "}
.supwhy ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.supwhy li{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start}
.supwhy li img{width:24px;height:24px;border-radius:50%;border:1px solid #242D4F;background:#0B0D16}
.supwhy li b{display:block;font-family:var(--ui);font-size:.9rem;color:var(--gild-hi)}
.supwhy li span{font-size:.86rem;color:var(--mute);line-height:1.4}
/* ---------- uniques */
.ufilters{display:grid;gap:8px;margin-bottom:14px}
.ufilters .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ufilters .row > .label{min-width:70px}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.ucard{display:grid;align-content:start}
.ucard .body{grid-template-columns:96px 1fr}
.ucard .art{width:96px;height:120px}
.ucard .art img{max-width:94px;max-height:118px}
.ucard .facts{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px}
.ucard .txt{padding:10px 12px;border-top:1px solid #18203E;display:grid;gap:6px;font-size:.93rem}
.ucard .txt b{font-family:var(--ui);color:var(--gild);font-weight:700;margin-right:4px}
.ucard.ucur{box-shadow:0 0 0 1px var(--wisp),0 0 22px rgba(127,215,216,.18)}
.ucard.dim{opacity:.62}
.price{font-family:var(--mono);font-size:.82rem}
.idols td img{width:30px;height:30px;vertical-align:middle;margin-right:8px}

/* ---------- meta */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
.opt{padding:16px;display:grid;gap:8px;align-content:start}
.opt h3{font-size:1.05rem}
.opt .ev{font-family:var(--ui);color:var(--wisp);font-size:.92rem}
.opt .was{font-size:.86rem;color:var(--faint);text-decoration:line-through;text-decoration-color:rgba(224,102,79,.6)}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.chart{padding:14px 16px}
.chart h3{font-size:1rem;margin-bottom:10px}
.bars{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.bars li{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:.92rem;position:relative}
.bars .nm{display:flex;gap:8px;align-items:center;min-width:0}
.bars .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>

/* ------------------------------------------------ building blocks */
const questPts = lv => { let q = 0; for (const [l, p] of A.quest || []) if (lv >= l) q = p; return q; };
const autoPts = lv => Math.max(0, lv - 1 + questPts(lv));

  return { m, next, pts, phaseN: O.n, extra: Math.max(0, pts - O.o.length), notables: m.filter(id => A.nodeKind[id]).map(mk), nextList: next.map(mk), prevIds };

function mountTree() {

  const tip = (el, meta) => (n, x, y) => {
    if (!n) { el.style.display = "none"; return; } const m = meta[n[0]]; if (!m) { el.style.display = "none"; return; }
    el.innerHTML = `<div class="th">${esc(m[0])}</div><div class="st">${(m[1] || []).map(s => `<span>${esc(s)}</span>`).join("") || "<span>—</span>"}</div>`;
    el.style.display = "block"; const box = el.parentElement.getBoundingClientRect();
    el.style.left = Math.min(x + 16, box.width - 330) + "px"; el.style.top = Math.min(y + 16, box.height - 120) + "px";

  TV = new TreeView($("#treeCv"), A.tree, { showNew: true, labels: !!S.treeLabels, onHover: tip($("#ttip"), A.tree.meta) });
  if (S.treeMeta) TV.metaSet = new Set(A.metaNotables.map(m => m.id));

  requestAnimationFrame(() => TV.fit(TV.fitIds));
  AV = new TreeView($("#ascCv"), A.asc, { pad: 160, labels: true, labelAll: true, onHover: tip($("#ttip2"), A.asc.meta) });
  AV.setAlloc({ m: al.a, s1: [], s2: [] }, null);

}

        ${(CHAR.buffs || []).map(b => { const im = gemImg(b.name); return `<label class="chk"><input type="checkbox" data-own="${esc(b.key)}" ${own(b.key) ? "checked" : ""}><span>${im ? `<img src="${im}" alt="">` : ""}${esc(b.name)} · ${Math.ceil(b.cost * tc.mult)} Spirit${b.note ? ` <small style="color:var(--faint)">${esc(b.note)}</small>` : ""}</span></label>`; }).join("")}

        <div class="rec ${st[0]}"><span class="ri">${{ ok: "✔", warn: "!", bad: "✖" }[st[0]]}</span><div><b>${esc(st[1])}</b><small>${esc(sec.note || "")}</small></div></div>

  }

}

function wisps() {
  const cv = $("#wisps"); if (!cv || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const ctx = cv.getContext("2d"); let w, h;
  const dots = Array.from({ length: 30 }, (_, i) => ({ x: Math.random(), y: Math.random(), r: .6 + Math.random() * 1.8, s: .0005 + Math.random() * .0015, o: Math.random() * 6.28, c: i % 5 === 0 ? "179,140,255" : i % 3 === 0 ? "210,226,255" : "111,227,224" }));
  const size = () => { w = cv.width = cv.offsetWidth * devicePixelRatio; h = cv.height = cv.offsetHeight * devicePixelRatio; };
  size(); addEventListener("resize", size);
  (function f(t) {
    ctx.clearRect(0, 0, w, h);
    dots.forEach(d => { d.y -= d.s; if (d.y < -.05) { d.y = 1.05; d.x = Math.random(); }
      const x = (d.x + Math.sin(t / 1400 + d.o) * .02) * w, y = d.y * h, a = .3 + .3 * Math.sin(t / 700 + d.o), R = d.r * 6 * devicePixelRatio;
      const g = ctx.createRadialGradient(x, y, 0, x, y, R); g.addColorStop(0, `rgba(${d.c},${a})`); g.addColorStop(1, `rgba(${d.c},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, 6.28); ctx.fill(); });
    requestAnimationFrame(f);
  })(0);
}
